name: CampusIQ CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare Supabase-compatible test schemas
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campos_test -v ON_ERROR_STOP=1 -f supabase/tests/pg_bootstrap.sql
      - name: Apply initial schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campos_test -v ON_ERROR_STOP=1 -f supabase/migrations/001_initial_schema.sql
      - name: Apply security and onboarding migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campos_test -v ON_ERROR_STOP=1 -f supabase/migrations/002_secure_onboarding_and_rls.sql
      - name: Exercise onboarding and authorization RPCs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campos_test -v ON_ERROR_STOP=1 -f supabase/tests/migration_smoke.sql
