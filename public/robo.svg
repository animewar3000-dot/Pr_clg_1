<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Robo, the CampOS AI companion"><defs><linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#343a63"/><stop offset="1" stop-color="#171a33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.shadow{animation:sh 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sh{50%{transform:scale(.85);opacity:.5}}.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.orb{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 10%}@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-28deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-20deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="shadow" cx="120" cy="246" rx="48" ry="7" fill="#000" opacity=".25"/><g class="float"><line x1="120" y1="54" x2="120" y2="32" stroke="#8b93c9" stroke-width="4" stroke-linecap="round"/><circle class="orb" cx="120" cy="24" r="8" fill="url(#accent)" filter="url(#glow)"/><rect x="28" y="100" width="18" height="46" rx="9" fill="url(#accent)"/><rect x="194" y="100" width="18" height="46" rx="9" fill="url(#accent)"/><rect x="80" y="176" width="80" height="48" rx="22" fill="url(#shell)" stroke="#4a4f7a" stroke-width="2"/><circle cx="120" cy="200" r="6" fill="url(#accent)" filter="url(#glow)"/><rect x="60" y="184" width="15" height="32" rx="7.5" fill="#2a2f55" stroke="#4a4f7a" stroke-width="2"/><rect class="wave" x="165" y="184" width="15" height="32" rx="7.5" fill="#2a2f55" stroke="#4a4f7a" stroke-width="2"/><rect x="44" y="54" width="152" height="124" rx="42" fill="url(#shell)" stroke="#4a4f7a" stroke-width="2"/><path d="M70 70 Q90 60 120 60" stroke="#fff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="62" y="74" width="116" height="82" rx="28" fill="#090b19"/><rect class="eye" x="88" y="98" width="16" height="28" rx="8" fill="#22d3ee" filter="url(#glow)"/><rect class="eye" x="136" y="98" width="16" height="28" rx="8" fill="#22d3ee" filter="url(#glow)"/><path d="M107 138 Q120 149 133 138" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/><circle cx="80" cy="136" r="5" fill="#f472b6" opacity=".35"/><circle cx="160" cy="136" r="5" fill="#f472b6" opacity=".35"/></g></svg>